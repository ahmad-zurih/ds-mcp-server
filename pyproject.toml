[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-mcp-server"
dynamic = ["version"]
description = "An MCP server exposing data science tools (plotting, stats, data exploration) to any LLM client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ahmad Alhineidi" }]
keywords = ["mcp", "llm", "data-science", "visualization", "plotly", "pandas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "pandas>=2.0,<3.0",
    "plotly>=7.0",
    "matplotlib>=3.7,<=3.10",
    "seaborn>=0.13.2",
    "numpy>=1.24,<2.4",
    "pingouin>=0.6",
    "statsmodels>=0.15",
    "wordcloud>=1.9.6",
    "beautifulsoup4>=4.15",
    "ddgs>=9.16",
    "python-dotenv>=1.2",
    "openai>=3.8",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "websockets>=17.1",
    "python-multipart>=0.0.32",
]

[project.urls]
Homepage = "https://github.com/ahmad-zurih/ds-mcp-server"
Repository = "https://github.com/ahmad-zurih/ds-mcp-server"
"Bug Tracker" = "https://github.com/ahmad-zurih/ds-mcp-server/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=1.4"]
playwright = ["playwright>=1.62"]
# The [web] extra is kept for backward compatibility but is now a no-op —
# fastapi/uvicorn/websockets ship with the base install so `ds-mcp-webui`
# works out of the box.
web = []
# [research] adds YouTube transcript support (arXiv/GitHub/Wikipedia use stdlib only)
research = ["youtube-transcript-api>=1.2"]
# [documents] adds PDF / Word / Excel document-intelligence tools
documents = [
    "pypdf>=6.17",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2",
    "openpyxl>=3.1.5",
]
# [ocr] adds image OCR (also requires the system `tesseract` binary)
ocr = ["pytesseract>=0.3.13", "Pillow>=12.3"]
# [profiling] adds one-shot dataset profiling reports
profiling = ["ydata-profiling>=4.18"]
all = [
    "ds-mcp-server[anthropic,playwright,research,documents,ocr,profiling]",
]
dev = [
    "pytest>=7.4",
    "openpyxl>=3.1.5",
    "httpx>=0.28",
    "pypdf>=6.17",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2",
    "reportlab>=5.0",
    "Pillow>=12.3",
]

[project.scripts]
ds-mcp-server = "ds_mcp_server.cli:serve"
ds-mcp-client = "ds_mcp_server.cli:chat"
ds-mcp-webui = "ds_mcp_server.cli:webui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ds_mcp_server.web" = ["static/*", "static/**/*"]
"ds_mcp_server.resources" = ["env.template"]

[tool.setuptools_scm]
# Version is derived from the latest git tag (e.g. tag "v0.2.0" -> version "0.2.0").
# On untagged commits, produces a dev version like "0.2.1.dev3+g1a2b3c4".
# Write the resolved version into the built package so `importlib.metadata` can read it.
version_file = "src/ds_mcp_server/_version.py"
# Prefer clean release versions on tagged commits; use PEP 440 dev scheme in between.
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
